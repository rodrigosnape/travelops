services:
  api:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 3333
    ports:
      - "3333:3333"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travelops
      POSTGRES_PASSWORD: travelops
      POSTGRES_DB: travelops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: